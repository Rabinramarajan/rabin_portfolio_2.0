# Verification only — publishing stays local.
#
# `npm run publish prod` builds and pushes the image to vcr.vercel.com from a
# developer machine, so no registry credentials live in GitHub. This workflow
# proves that whatever landed on main would build and pass, and that the
# committed release record is consistent with publish/config.json.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  version-record:
    name: Release record is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # src/generated/version.json is committed because .dockerignore keeps
      # publish/ out of the image. Regenerating it must be a no-op; if it is
      # not, a release was recorded without committing the generated file.
      - name: Regenerate and diff
        run: |
          node scripts/generate-version.mjs
          if ! git diff --quiet -- src/generated/version.json; then
            echo "::error file=src/generated/version.json::Out of sync with publish/config.json. Run 'npm run version:sync' and commit the result."
            git --no-pager diff -- src/generated/version.json
            exit 1
          fi
          echo "✓ v$(node -p "require('./src/generated/version.json').version") is in sync"

      - name: package.json mirrors the published version
        run: |
          pkg=$(node -p "require('./package.json').version")
          rel=$(node -p "require('./src/generated/version.json').version")
          if [ "$pkg" != "$rel" ]; then
            echo "::error file=package.json::package.json is $pkg but the published release is $rel."
            exit 1
          fi
          echo "✓ package.json and release record agree on $pkg"

  manifests:
    name: Kustomize overlays render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      # A broken overlay would otherwise only surface as an ArgoCD sync
      # failure, after the image is already built and pushed.
      - name: Build every overlay
        run: |
          for overlay in deploy/overlays/*/; do
            echo "--- $overlay"
            kustomize build "$overlay" > /dev/null
          done
          echo "✓ all overlays render"

      # The overlays are the deployed truth; publish/config.json is the
      # published truth. If they disagree, the cluster is running something
      # other than the recorded release.
      - name: Overlays match publish/config.json
        run: |
          set -euo pipefail
          status=0
          check() {
            env="$1" overlay="$2"
            want="$(node -p "require('./publish/config.json')['$env'].docker"):v$(node -p "require('./publish/config.json')['$env'].version")"
            got=$(kustomize build "deploy/overlays/$overlay" \
              | grep -m1 -oE 'image: [^[:space:]]+' | cut -d' ' -f2)
            if [ "$want" != "$got" ]; then
              echo "::error file=deploy/overlays/$overlay/kustomization.yaml::$overlay deploys $got but publish/config.json records $want. The Release workflow syncs this — rerun it, or run 'kustomize edit set image' locally."
              status=1
            else
              echo "✓ $overlay -> $got"
            fi
          }
          check demo staging
          check prod production
          exit $status

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    # Only worth the minutes once the code itself is known good.
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — no push, no registry credentials. Mirrors what
      # publish.js does locally so a broken Dockerfile is caught here.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: rabin-portfolio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
