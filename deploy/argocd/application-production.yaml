apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  # ArgoCD Image Updater watches the registry and bumps the tag for us, so a
  # `npm run publish prod` is the only manual step in a release.
  #
  # write-back-method=git is deliberate: the alternative (argocd) mutates the
  # live Application only, leaving the cluster running a tag git has no record
  # of — the exact drift selfHeal and "roll back with git revert" exist to
  # prevent. Writing to git keeps the commit history the source of truth.
  annotations:
    argocd-image-updater.argoproj.io/image-list: >-
      portfolio=vcr.vercel.com/rabin-projects/rabin-portfolio-2-0/rabin_portfolio_prod
    # Only ever move to a higher semver. `latest` and any stray tag are ignored,
    # so a mistaken push cannot roll production forward on its own.
    argocd-image-updater.argoproj.io/portfolio.update-strategy: semver
    argocd-image-updater.argoproj.io/portfolio.allow-tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
    # Must match the `images[].name` key in the overlay kustomization, not the
    # rendered image — that is the field Image Updater rewrites.
    argocd-image-updater.argoproj.io/portfolio.kustomize.image-name: >-
      vcr.vercel.com/rabin-projects/rabin-portfolio-2-0/rabin_portfolio_prod
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/write-back-target: kustomization:deploy/overlays/production
spec:
  project: portfolio
  source:
    repoURL: https://github.com/Rabinramarajan/rabin_portfolio_2.0.git
    targetRevision: main
    path: deploy/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio
  syncPolicy:
    automated:
      prune: true
      # selfHeal reverts manual kubectl edits back to git. Keep it on: a live
      # hotfix that git does not know about is the failure mode GitOps exists
      # to prevent.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
  # The HPA owns replica count at runtime; without this, every scale event
  # shows production as OutOfSync against the committed value.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
