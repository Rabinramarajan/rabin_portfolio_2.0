apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
spec:
  # Overlays set the real count; 1 keeps `kustomize build base` runnable alone.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portfolio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portfolio
    spec:
      # vcr.vercel.com is private — every pull needs this. Created per
      # namespace from a Vercel token; see deploy/README.md.
      imagePullSecrets:
        - name: vcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portfolio
          # Tag is a placeholder — every overlay pins it via `images:` in its
          # kustomization.yaml, synced from publish/config.json.
          image: vcr.vercel.com/rabin-projects/rabin-portfolio-2-0/rabin_portfolio_prod:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          envFrom:
            - configMapRef:
                name: portfolio-config
            # Created out-of-band, never committed. See deploy/README.md.
            - secretRef:
                name: portfolio-secrets
                optional: true
          # Next.js finishes booting well under 10s; the failureThreshold gives
          # a slow node headroom without delaying a healthy rollout.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # No CPU limit on purpose: throttling a request-driven Node
              # process hurts p99 far more than the noisy-neighbour risk here.
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # readOnlyRootFilesystem: Next writes its image-optimizer cache and
            # scratch files at runtime, so both paths need writable emptyDirs.
            - name: cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
