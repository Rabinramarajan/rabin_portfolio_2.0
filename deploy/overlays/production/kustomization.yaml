apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: portfolio

resources:
- ../../base
- ingress.yaml
- hpa.yaml
- pdb.yaml

labels:
- pairs:
    app.kubernetes.io/instance: portfolio-production

# What production runs. Synced from publish/config.json ("prod".version) by
# .github/workflows/release.yml; ArgoCD deploys whatever this commit says.
# To roll back, revert the bump commit — never `kubectl set image`.
images:
- name: vcr.vercel.com/rabin-projects/rabin-portfolio-2-0/rabin_portfolio_prod
  newTag: v1.0.1

patches:
- path: rollout.yaml
