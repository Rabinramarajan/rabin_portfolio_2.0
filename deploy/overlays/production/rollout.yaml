apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
spec:
  # HPA owns the live count; this is only the value applied at first create.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the current capacity during a rollout.
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      # Keep the replicas off a single node so one drain can't take the site down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: portfolio
      containers:
        - name: portfolio
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
