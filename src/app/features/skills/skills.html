<section class="page-section container">
  <app-section-heading
    [level]="1"
    eyebrow="Skills"
    title="My toolbox"
    description="Angular and TypeScript are where the depth is. The rest is what it takes to ship a product end to end."
  />

  <div class="groups">
    @for (group of groups; track group.id) {
      <article class="group" [class.group--primary]="group.id === primaryGroupId" appReveal>
        <h2 class="group__title">{{ group.label }}</h2>
        <p class="group__note">{{ group.note }}</p>
        <ul class="group__skills">
          @for (skill of group.skills; track skill) {
            <li><app-skill-badge [label]="skill" [highlighted]="group.id === primaryGroupId" /></li>
          }
        </ul>
      </article>
    }
  </div>
</section>
